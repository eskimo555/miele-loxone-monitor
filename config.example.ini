# Copy to /home/pi/scripts/config.ini and fill in. Never commit the real file.

[Loxone]
server = 192.168.x.x
user = your_loxone_user
pass = your_loxone_password

[Miele]
# From https://developer.miele.com (client credentials)
client_id = xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
client_secret = xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# Must match the redirect URI allowed for your Miele client
redirect_uri = http://localhost:8080/callback
# new = auth.domestic.miele-iot.com, legacy = api.mcs3.miele.com/thirdparty
oauth = new
# scope = mcs_thirdparty_read mcs_thirdparty_write
# Existing token, only used as fallback until --login is done
# auth_token = XX_xxxxxxxx

[Devices]
washer = 000000000000
dryer = 000000000001
